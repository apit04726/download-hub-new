<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownloadHub | Premium Android Apps & Games Portal</title>
    <meta name="description" content="Discover, explore, and safely download verified Android apps & games with Play Protect security and high-speed APK packages.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Open Graph / WhatsApp / Facebook Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DownloadHub">
    <meta property="og:title" content="DownloadHub | Premium Android Apps & Games Portal">
    <meta property="og:description" content="Discover, explore, and safely download verified Android apps & games with Play Protect security and high-speed APK packages.">
    <meta property="og:image" content="https://download-hub-new.vercel.app/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="144">
    <meta property="og:image:height" content="144">
    <meta property="og:url" content="https://download-hub-new.vercel.app/">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="DownloadHub | Premium Android Apps & Games Portal">
    <meta name="twitter:description" content="Discover, explore, and safely download verified Android apps & games with Play Protect security and high-speed APK packages.">
    <meta name="twitter:image" content="https://download-hub-new.vercel.app/og-banner.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/wp-content/themes/download-hub-theme/style.css">

    <!-- React 18 & Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        svg { display: inline-block !important; vertical-align: middle; }
        .brand-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #01875F 0%, #34A853 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(1, 135, 95, 0.3);
            flex-shrink: 0;
        }
        .btn-install-sm {
            background: linear-gradient(135deg, #01875F 0%, #34A853 100%);
            color: #ffffff !important;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.75rem 1.6rem;
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 14px rgba(1, 135, 95, 0.35);
            letter-spacing: 0.01em;
            outline: none;
        }
        .btn-install-sm:hover {
            background: linear-gradient(135deg, #00704F 0%, #2D9647 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(1, 135, 95, 0.45);
        }
        .admin-badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.45rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .admin-badge-pill:hover {
            background: var(--bg-hover);
            border-color: var(--play-green);
        }
        .btn-cancel-download {
            background: #FEF2F2 !important;
            color: #DC2626 !important;
            border: 1px solid #FCA5A5 !important;
            font-size: 0.9rem !important;
            font-weight: 600 !important;
            padding: 0.65rem 1.5rem !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            width: 100% !important;
            justify-content: center !important;
            transition: all 0.2s ease !important;
            font-family: inherit !important;
            outline: none !important;
        }
        .btn-cancel-download:hover {
            background: #FEE2E2 !important;
            border-color: #F87171 !important;
            color: #B91C1C !important;
        }
        @keyframes skeleton-pulse {
            0% { opacity: 0.8; }
            50% { opacity: 0.35; }
            100% { opacity: 0.8; }
        }
        .skeleton-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            animation: skeleton-pulse 1.4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Helper to format relative asset URLs to root-relative paths for SPA routing
        const formatAssetUrl = (url) => {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('/')) {
                return url;
            }
            return '/' + url;
        };

        // Parse initial URL path synchronously to prevent initial render flicker
        const parseInitialRoute = () => {
            const path = window.location.pathname.replace(/^\/|\/$/g, '').trim();
            if (path && path !== 'index.html') {
                return { view: 'details', appId: path.toLowerCase() };
            }
            return { view: 'home', appId: null };
        };

        function App() {
            const initialRoute = React.useMemo(() => parseInitialRoute(), []);
            const [apps, setApps] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);
            const [currentView, setCurrentView] = React.useState(initialRoute.view);
            const [selectedAppId, setSelectedAppId] = React.useState(initialRoute.appId);
            const [selectedCategory, setSelectedCategory] = React.useState('all');
            const [searchQuery, setSearchQuery] = React.useState('');

            // Single Source of Truth: Load data_store.json dynamically from root
            React.useEffect(() => {
                fetch('/data_store.json?t=' + Date.now())
                    .then(res => res.json())
                    .then(data => {
                        let loadedApps = data;
                        const localEdits = localStorage.getItem('download_hub_custom_edits');
                        if (localEdits) {
                            try {
                                loadedApps = JSON.parse(localEdits);
                            } catch (e) {}
                        }
                        setApps(loadedApps);
                        setIsLoading(false);

                        // Sync path matching after data load
                        const path = window.location.pathname.replace(/^\/|\/$/g, '').trim();
                        if (path && path !== 'index.html') {
                            const found = loadedApps.find(a => a.id.toLowerCase() === path.toLowerCase());
                            if (found) {
                                setCurrentView('details');
                                setSelectedAppId(found.id);
                                return;
                            }
                        } else {
                            setCurrentView('home');
                            setSelectedAppId(null);
                        }
                    })
                    .catch(err => {
                        console.error("Error loading data_store.json:", err);
                        setIsLoading(false);
                    });
            }, []);

            // Router & Navigation Handler (Syncs React State with Browser Address Bar & History)
            const navigateTo = React.useCallback((view, appId = null, replace = false) => {
                setCurrentView(view);
                setSelectedAppId(appId);
                let targetPath = '/';
                if (view === 'details' && appId) {
                    targetPath = `/${appId}`;
                }
                if (window.location.pathname !== targetPath) {
                    if (replace) {
                        window.history.replaceState({ view, appId }, '', targetPath);
                    } else {
                        window.history.pushState({ view, appId }, '', targetPath);
                    }
                }
            }, []);

            // Browser Back/Forward (popstate) Handler
            React.useEffect(() => {
                const handlePopState = () => {
                    const path = window.location.pathname.replace(/^\/|\/$/g, '').trim();
                    if (path && path !== 'index.html' && apps.length > 0) {
                        const found = apps.find(a => a.id.toLowerCase() === path.toLowerCase());
                        if (found) {
                            setCurrentView('details');
                            setSelectedAppId(found.id);
                            return;
                        }
                    }
                    setCurrentView('home');
                    setSelectedAppId(null);
                };

                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [apps]);

            // Scroll-To-Top & Mobile Navigation State
            const [showScrollTop, setShowScrollTop] = React.useState(false);

            // Handle Scroll Position for Floating FAB
            React.useEffect(() => {
                const handleScroll = () => {
                    setShowScrollTop(window.scrollY > 250);
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Auto Scroll to Top on View / Category / App Selection Change
            React.useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [currentView, selectedAppId, selectedCategory]);

            // Smooth Scroll to Top Helper
            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // APK Download Modal State
            const [downloadModalApp, setDownloadModalApp] = React.useState(null);
            const [downloadTimer, setDownloadTimer] = React.useState(5);
            const [downloading, setDownloading] = React.useState(false);
            const [downloadComplete, setDownloadComplete] = React.useState(false);

            // Screenshot Preview Lightbox
            const [previewScreenshot, setPreviewScreenshot] = React.useState(null);

            // Scroll Screenshots Carousel
            const scrollScreenshots = (amount) => {
                const el = document.getElementById('playScreenshotScroll');
                if (el) {
                    el.scrollBy({ left: amount, behavior: 'smooth' });
                }
            };

            // Start APK Download Countdown
            const startDownloadFlow = (appItem) => {
                setDownloadModalApp(appItem);
                setDownloadTimer(5);
                setDownloading(true);
                setDownloadComplete(false);
            };

            // Trigger actual direct file download
            const triggerDirectDownload = () => {
                if (!downloadModalApp) return;
                let apkPath = downloadModalApp.acf?.apk_file;
                if (!apkPath || apkPath === '#') {
                    apkPath = `/uploads/apks/${downloadModalApp.id}.apk`;
                } else {
                    apkPath = formatAssetUrl(apkPath);
                }
                
                // Trigger download link
                const link = document.createElement('a');
                link.href = apkPath;
                link.rel = 'noopener';
                link.setAttribute('download', `${downloadModalApp.id}.apk`);
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    document.body.removeChild(link);
                }, 100);

                setDownloadModalApp(null);
            };

            // React Effect to handle APK download countdown
            React.useEffect(() => {
                let timer;
                if (downloading && downloadTimer > 0) {
                    timer = setTimeout(() => {
                        setDownloadTimer(downloadTimer - 1);
                    }, 1000);
                } else if (downloading && downloadTimer === 0) {
                    setDownloadComplete(true);
                    setDownloading(false);
                    triggerDirectDownload();
                }
                return () => clearTimeout(timer);
            }, [downloading, downloadTimer]);

            // Filtered Apps List based on Category and Search Query
            const filteredApps = apps.filter(app => {
                const matchesCat = selectedCategory === 'all' || 
                    (app.category_slug && app.category_slug.toLowerCase() === selectedCategory.toLowerCase()) ||
                    (app.category && app.category.toLowerCase() === selectedCategory.toLowerCase());

                const q = searchQuery.toLowerCase().trim();
                const matchesSearch = !q || 
                    app.title.toLowerCase().includes(q) || 
                    (app.tagline && app.tagline.toLowerCase().includes(q)) || 
                    (app.category && app.category.toLowerCase().includes(q));

                return matchesCat && matchesSearch;
            });

            const selectedApp = apps.find(a => a.id.toLowerCase() === (selectedAppId || '').toLowerCase());

            // Dynamic Social Media Preview Meta Tags (Open Graph & Twitter Cards)
            React.useEffect(() => {
                const setMeta = (propName, content) => {
                    let el = document.querySelector(`meta[property="${propName}"]`) || document.querySelector(`meta[name="${propName}"]`);
                    if (el) {
                        el.setAttribute('content', content);
                    }
                };

                if (currentView === 'details' && selectedApp) {
                    const appTitle = `${selectedApp.title} APK Download (v${selectedApp.acf?.app_version || '1.0'})`;
                    const appDesc = selectedApp.tagline || selectedApp.description?.slice(0, 140) || `Download ${selectedApp.title} APK package safely on DownloadHub.`;
                    const appIcon = selectedApp.acf?.app_icon ? (window.location.origin + formatAssetUrl(selectedApp.acf.app_icon)) : `${window.location.origin}/og-image.png`;
                    const appUrl = `${window.location.origin}/${selectedApp.id}`;

                    document.title = `${selectedApp.title} APK Download | DownloadHub`;
                    setMeta('og:title', appTitle);
                    setMeta('og:description', appDesc);
                    setMeta('og:image', appIcon);
                    setMeta('og:url', appUrl);
                    setMeta('twitter:title', appTitle);
                    setMeta('twitter:description', appDesc);
                    setMeta('twitter:image', appIcon);
                } else {
                    document.title = 'DownloadHub | Premium Android Apps & Games Portal';
                    setMeta('og:title', 'DownloadHub | Premium Android Apps & Games Portal');
                    setMeta('og:description', 'Discover, explore, and safely download verified Android apps & games with Play Protect security.');
                    setMeta('og:image', `${window.location.origin}/og-image.png`);
                    setMeta('og:url', `${window.location.origin}/`);
                }
            }, [currentView, selectedApp]);

            // Smart Share Handler (Web Share API for WhatsApp, Telegram, FB, Twitter + Clipboard Fallback)
            const handleShareApp = (appItem) => {
                if (!appItem) return;
                const shareUrl = `${window.location.origin}/${appItem.id}`;
                const shareData = {
                    title: `${appItem.title} APK Download`,
                    text: `Check out ${appItem.title} (v${appItem.acf?.app_version || '1.0'}) APK on DownloadHub! ${appItem.tagline || ''}`,
                    url: shareUrl
                };

                if (navigator.share) {
                    navigator.share(shareData).catch(() => {});
                } else {
                    navigator.clipboard.writeText(shareUrl);
                    alert(`📲 Link copied for ${appItem.title}!\n\n${shareUrl}\n\nWhen you paste and share this link on WhatsApp, Telegram, or Facebook, the app icon & description will appear automatically in the link preview!`);
                }
            };

            return (
                <div>
                    {/* Header Navbar */}
                    <header className="site-header">
                        <div className="nav-container">
                            <a href="/" onClick={(e) => { e.preventDefault(); navigateTo('home', null); }} className="brand-logo" style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', textDecoration: 'none' }}>
                                <div className="brand-logo-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="7 10 12 15 17 10"></polyline>
                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                    </svg>
                                </div>
                                <div style={{ fontFamily: 'var(--font-heading)', fontSize: '1.3rem', fontWeight: 800, color: 'var(--text-main)', letterSpacing: '-0.02em', display: 'flex', alignItems: 'center' }}>
                                    Download<span style={{ color: 'var(--play-green)' }}>Hub</span>
                                    <span style={{ width: '6px', height: '6px', background: 'var(--play-green)', borderRadius: '50%', display: 'inline-block', marginLeft: '2px' }}></span>
                                </div>
                            </a>

                            {/* Search Input */}
                            <div className="search-bar-wrap">
                                <svg className="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input 
                                    type="text" 
                                    className="search-input" 
                                    placeholder="Search Android apps, games, APKs..." 
                                    value={searchQuery}
                                    onChange={(e) => { setSearchQuery(e.target.value); navigateTo('home', null); }}
                                />
                                <span className="search-kbd">⌘K</span>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="layout-container">
                        {isLoading ? (
                            <div style={{ padding: '2.5rem 0' }}>
                                {currentView === 'details' ? (
                                    <div>
                                        <div style={{ display: 'flex', gap: '1.5rem', alignItems: 'center', marginBottom: '2.5rem', flexWrap: 'wrap' }}>
                                            <div className="skeleton-box" style={{ width: '110px', height: '110px', borderRadius: '24px' }}></div>
                                            <div style={{ flex: 1, minWidth: '240px' }}>
                                                <div className="skeleton-box" style={{ width: '65%', height: '32px', borderRadius: '8px', marginBottom: '1rem' }}></div>
                                                <div className="skeleton-box" style={{ width: '45%', height: '20px', borderRadius: '6px', marginBottom: '1.25rem' }}></div>
                                                <div className="skeleton-box" style={{ width: '160px', height: '46px', borderRadius: '24px' }}></div>
                                            </div>
                                        </div>
                                        <div className="skeleton-box" style={{ width: '100%', height: '280px', borderRadius: '16px' }}></div>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="skeleton-box" style={{ width: '100%', height: '180px', borderRadius: '20px', marginBottom: '2rem' }}></div>
                                        <div className="play-apps-grid">
                                            {[1, 2, 3, 4, 5, 6].map(n => (
                                                <div key={n} className="skeleton-box" style={{ height: '180px', borderRadius: '16px' }}></div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <>
                                {currentView === 'home' && (
                                    <div>
                                        {/* Hero Banner */}
                                        <section className="play-hero-banner">
                                            <div className="play-hero-banner-content">
                                                <span className="security-badge-box" style={{ marginBottom: '0.75rem' }}>
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#01875F" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                    100% Malware Free & Play Protect Verified
                                                </span>
                                                <h1 className="play-hero-banner-title">Discover & Download Premium Android Apps</h1>
                                                <p className="play-hero-banner-sub">Your trusted destination for verified, virus-free Android APKs, original app packages, and high-speed direct downloads.</p>
                                            </div>
                                        </section>

                                        {/* Category Chips Filter Bar */}
                                        <div className="play-category-chips-wrap" style={{ marginBottom: '1.75rem', overflowX: 'auto', paddingBottom: '0.5rem', scrollbarWidth: 'none' }}>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                                                {['all','tools','productivity'].map(cat => (
                                                    <button
                                                        key={cat}
                                                        onClick={() => { setSelectedCategory(cat); navigateTo('home', null); }}
                                                        className={`play-chip-item ${selectedCategory === cat ? 'active' : ''}`}
                                                        style={{
                                                            padding: '0.55rem 1.35rem',
                                                            borderRadius: 'var(--radius-full)',
                                                            fontSize: '0.88rem',
                                                            fontWeight: 600,
                                                            border: selectedCategory === cat ? 'none' : '1px solid var(--border-color)',
                                                            background: selectedCategory === cat ? 'var(--play-green)' : 'var(--bg-surface)',
                                                            color: selectedCategory === cat ? '#FFFFFF' : 'var(--text-main)',
                                                            cursor: 'pointer',
                                                            whiteSpace: 'nowrap',
                                                            transition: 'all 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
                                                            boxShadow: selectedCategory === cat ? '0 4px 14px rgba(1, 135, 95, 0.3)' : 'none'
                                                        }}
                                                    >
                                                        {cat === 'all' ? '✨ All Apps' : (cat.charAt(0).toUpperCase() + cat.slice(1))}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Section Header */}
                                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
                                            <div>
                                                <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.5rem', fontWeight: 700, color: 'var(--text-main)' }}>
                                                    {selectedCategory === 'all' ? 'Recommended Applications' : `${selectedCategory.charAt(0).toUpperCase() + selectedCategory.slice(1)} Apps`}
                                                </h2>
                                                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Selected top rated apps & games</p>
                                            </div>
                                            <span style={{ color: 'var(--play-green)', fontWeight: 700, fontSize: '0.9rem' }}>
                                                {filteredApps.length} Apps Available
                                            </span>
                                        </div>

                                        {/* Apps Grid */}
                                        {filteredApps.length === 0 ? (
                                            <div style={{ padding: '4rem 2rem', textAlign: 'center', background: 'var(--bg-surface)', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)', marginBottom: '3rem' }}>
                                                <h3 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.5rem', marginBottom: '0.5rem' }}>No Apps Found</h3>
                                                <p style={{ color: 'var(--text-muted)', marginBottom: '1.5rem' }}>Try searching for another keyword or upload a new app via Admin Portal.</p>
                                                <button onClick={() => { setSelectedCategory('all'); setSearchQuery(''); navigateTo('home', null); }} className="btn-primary">View All Apps</button>
                                            </div>
                                        ) : (
                                            <div className="play-apps-grid">
                                                {filteredApps.map(appItem => {
                                                    const acf = appItem.acf || {};
                                                    return (
                                                        <article key={appItem.id} className="play-app-card">
                                                            <div>
                                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '0.85rem' }}>
                                                                    <a href={`/${appItem.id}`} onClick={(e) => { e.preventDefault(); navigateTo('details', appItem.id); }}>
                                                                        <img src={formatAssetUrl(acf.app_icon)} alt={appItem.title} className="play-card-icon" loading="lazy" />
                                                                    </a>
                                                                    <span className="card-cat-tag">{appItem.category}</span>
                                                                </div>

                                                                <div className="play-card-info" style={{ marginBottom: '0.85rem' }}>
                                                                    <h3 className="play-card-name">
                                                                        <a href={`/${appItem.id}`} onClick={(e) => { e.preventDefault(); navigateTo('details', appItem.id); }}>
                                                                            {appItem.title}
                                                                        </a>
                                                                    </h3>
                                                                    <div className="play-card-company">{acf.app_developer}</div>
                                                                    
                                                                    <div className="play-card-badges">
                                                                        <span className="rating-badge">★ {acf.app_rating}</span>
                                                                        <span className="version-badge">{acf.app_version}</span>
                                                                        <span className="size-badge">{acf.app_size}</span>
                                                                    </div>
                                                                </div>

                                                                <p className="play-card-desc">{appItem.tagline}</p>
                                                            </div>

                                                            <div className="play-card-footer">
                                                                <span className="download-count">
                                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                                                        <polyline points="7 10 12 15 17 10"></polyline>
                                                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                                                    </svg>
                                                                    <span>{Number(acf.download_count || 100).toLocaleString()}</span> downloads
                                                                </span>

                                                                <button 
                                                                    onClick={() => navigateTo('details', appItem.id)} 
                                                                    className="btn-install-sm"
                                                                >
                                                                    View Details
                                                                </button>
                                                            </div>
                                                        </article>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                )}

                                            <div className="play-hero-left">
                                                <h1 className="play-hero-title">{selectedApp.title}</h1>

                                                <div className="play-stats-row">

                                                    <div className="play-stat-col" style={{ borderLeft: '1px solid var(--border-color)', paddingLeft: '2rem' }}>

                                                    </div>

                                                    <div className="play-stat-col" style={{ borderLeft: '1px solid var(--border-color)', paddingLeft: '2rem' }}>
                                                        <div className="play-stat-val" style={{ fontSize: '0.95rem' }}>
                                                            <span style={{ border: '1px solid var(--text-muted)', padding: '0.15rem 0.5rem', borderRadius: '4px', fontSize: '0.75rem', fontWeight: 700 }}>12+</span>
                                                        </div>
                                                        <div className="play-stat-sub">Rated for 12+</div>
                                                    </div>
                                                </div>

                                                <div className="play-hero-actions">
                                                    <button className="btn-install" onClick={() => startDownloadFlow(selectedApp)}>
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

                                                    <button className="btn-secondary-action" onClick={() => handleShareApp(selectedApp)}>
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ marginRight: '0.4rem' }}><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>

                                                    </button>

                                                <div className="device-compatibility" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', marginTop: '1.25rem' }}>
                                                    <div style={{ display: 'inline-flex', alignItems: 'flex-start', gap: '0.55rem' }}>
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#01875F" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                        <span style={{ fontSize: '0.88rem', color: 'var(--text-muted)' }}>This app is available for your device (Requires {selectedApp.acf?.min_android})</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="play-hero-right">
                                                <img src={formatAssetUrl(selectedApp.acf?.app_icon)} alt={selectedApp.title} className="play-hero-app-icon" />
                                            </div>
                                        </section>

                                        {/* Screenshots Carousel with Navigation Arrows */}
                                        {selectedApp.acf?.screenshots && selectedApp.acf.screenshots.length > 0 && (
                                            <section className="play-screenshots-container" style={{ position: 'relative' }}>
                                                <button className="screenshot-arrow arrow-left" onClick={() => scrollScreenshots(-350)} aria-label="Previous screenshots">
                                                    &lsaquo;
                                                </button>
                                                <div className="play-screenshots-scroll" id="playScreenshotScroll">
                                                    {selectedApp.acf.screenshots.map((shot, idx) => (
                                                        <div key={idx} className="screenshot-wrapper" onClick={() => setPreviewScreenshot(shot)}>
                                                            <img src={formatAssetUrl(shot)} alt={`Screenshot ${idx + 1}`} className="play-screenshot-item" />
                                                            <div className="screenshot-overlay-zoom">
                                                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button className="screenshot-arrow arrow-right" onClick={() => scrollScreenshots(350)} aria-label="Next screenshots">
                                                    &rsaquo;
                                                </button>
                                            </section>
                                        )}

                                        {/* Details & Sidebar */}
                                        <div className="play-main-layout">
                                            <div className="play-content-left">
                                                <div className="play-section-title">
                                                    <span>About this app</span>
                                                </div>
                                                <p className="play-description" style={{ whiteSpace: 'pre-line' }}>{selectedApp.description}</p>

                                                <div className="play-section-title">
                                                    <span>Technical Specifications & Package Info</span>
                                                </div>

                                                <div className="play-specs-grid">
                                                    <div className="spec-card">
                                                        <div className="spec-icon">📦</div>
                                                        <div>
                                                            <div className="spec-cell-label">Version</div>
                                                            <div className="spec-cell-val">{selectedApp.acf?.app_version}</div>
                                                        </div>
                                                    </div>
                                                    <div className="spec-card">
                                                        <div className="spec-icon">📅</div>
                                                        <div>
                                                            <div className="spec-cell-label">Updated on</div>
                                                            <div className="spec-cell-val">{selectedApp.acf?.release_date}</div>
                                                        </div>
                                                    </div>
                                                    <div className="spec-card">
                                                        <div className="spec-icon">⚡</div>
                                                        <div>
                                                            <div className="spec-cell-label">Download Size</div>
                                                            <div className="spec-cell-val">{selectedApp.acf?.app_size}</div>
                                                        </div>
                                                    </div>
                                                    <div className="spec-card">
                                                        <div className="spec-icon">📱</div>
                                                        <div>
                                                            <div className="spec-cell-label">Requires Android</div>
                                                            <div className="spec-cell-val">{selectedApp.acf?.min_android}</div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {selectedApp.acf?.features && selectedApp.acf.features.length > 0 && (
                                                    <div style={{ marginTop: '2.5rem' }}>
                                                        <div className="play-section-title">
                                                            <span>Key Highlights & Features</span>
                                                        </div>
                                                        <ul className="features-checklist play-features-grid">
                                                            {selectedApp.acf.features.map((feat, idx) => (
                                                                <li key={idx} style={{ display: 'flex', alignItems: 'center', gap: '0.85rem', background: 'var(--bg-surface)', padding: '0.85rem 1.25rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)' }}>
                                                                    <div className="check-icon">✓</div>
                                                                    <span>{feat}</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Sidebar */}
                                            <div className="play-sidebar">
                                                <div className="sidebar-card">
                                                    <div className="sidebar-title">
                                                        <span>App support</span>
                                                    </div>
                                                    <div style={{ fontSize: '0.88rem', color: 'var(--text-muted)', display: 'grid', gap: '0.75rem' }}>
                                                        <div>📧 <strong>Support Email:</strong> support@{selectedApp.id}.com</div>
                                                        <div>🌐 <strong>Developer:</strong> {selectedApp.acf?.app_developer}</div>
                                                        <div>🔒 <strong>Privacy Policy:</strong> <span style={{ color: 'var(--play-green)', fontWeight: 600 }}>Verified Clean</span></div>
                                                    </div>
                                                </div>

                                                <div className="sidebar-card">
                                                    <div className="sidebar-title" style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                        <span>Similar apps</span>
                                                        <a href="/" onClick={(e) => { e.preventDefault(); navigateTo('home', null); }} style={{ color: 'var(--play-green)', fontSize: '0.85rem' }}>View All</a>
                                                    </div>
                                                    {apps.filter(a => a.id !== selectedApp.id).slice(0, 3).map(other => (
                                                        <a key={other.id} href={`/${other.id}`} onClick={(e) => { e.preventDefault(); navigateTo('details', other.id); }} className="similar-app-item">
                                                            <img src={formatAssetUrl(other.acf?.app_icon)} className="similar-app-icon" />
                                                            <div className="similar-app-meta">
                                                                <div className="similar-app-name">{other.title}</div>
                                                                <div className="similar-app-company">{other.acf?.app_developer}</div>
                                                                <div className="similar-app-rating">★ {other.acf?.app_rating}</div>
                                                            </div>
                                                        </a>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* INVALID APP / APP NOT FOUND VIEW */}
                                {currentView === 'details' && !selectedApp && (
                                    <div style={{ padding: '4rem 2rem', textAlign: 'center', background: 'var(--bg-surface)', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)', margin: '2rem 0' }}>
                                        <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.6rem', marginBottom: '0.5rem', color: 'var(--text-main)' }}>App Not Found</h2>
                                        <p style={{ color: 'var(--text-muted)', marginBottom: '1.5rem' }}>The requested application could not be found or may have been removed.</p>
                                        <button onClick={() => navigateTo('home', null)} className="btn-primary" style={{ display: 'inline-flex', margin: '0 auto' }}>
                                            Browse All Apps
                                        </button>
                                    </div>
                                )}
                            </>
                        )}
                    </main>     )}
                    </main>

                    <footer className="site-footer">
                        <div className="footer-container">
                            <div className="footer-grid">
                                {/* Column 1: Brand Info */}
                                <div className="footer-col brand-col">
                                    <a href="/" onClick={(e) => { e.preventDefault(); navigateTo('home', null); }} className="brand-logo" style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', textDecoration: 'none', marginBottom: '1.15rem' }}>
                                        <div className="brand-logo-icon" style={{ width: '38px', height: '38px', background: 'linear-gradient(135deg, #01875F 0%, #34A853 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(1, 135, 95, 0.3); flex-shrink: 0;' }}>
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                                <polyline points="7 10 12 15 17 10"></polyline>
                                                <line x1="12" y1="15" x2="12" y2="3"></line>
                                            </svg>
                                        </div>
                                        <div style={{ fontFamily: 'var(--font-heading)', fontSize: '1.3rem', fontWeight: 800, color: 'var(--text-main)', letterSpacing: '-0.02em', display: 'flex', alignItems: 'center' }}>
                                            Download<span style={{ color: 'var(--play-green)' }}>Hub</span>
                                            <span style={{ width: '6px', height: '6px', background: 'var(--play-green)', borderRadius: '50%', display: 'inline-block', marginLeft: '2px' }}></span>
                                        </div>
                                    </a>
                                    <p className="footer-desc">
                                        Discover, explore, and safely download verified Android apps & games with Play Protect security and high-speed APK packages.
                                    </p>
                                    <div className="security-badge-box">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#01875F" strokeWidth="2.5">
                                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                            <polyline points="9 12 11 14 15 10"></polyline>
                                        </svg>
                                        <span>100% Virus Free & Play Protect Verified</span>
                                    </div>
                                </div>

                                {/* Column 2: Categories */}
                                <div className="footer-col">
                                    <h4 className="footer-col-title">Categories</h4>
                                    <ul className="footer-links">
                                        {['all', 'games', 'tools', 'photography', 'health', 'productivity'].map(cat => (
                                            <li key={cat}>
                                                <a 
                                                    href="/" 
                                                    onClick={(e) => { e.preventDefault(); setSelectedCategory(cat); navigateTo('home', null); }} 
                                                    style={{ textDecoration: 'none', textTransform: 'capitalize' }}
                                                >
                                                    {cat === 'all' ? 'All Apps' : cat}
                                                </a>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                {/* Column 3: Top Apps */}
                                <div className="footer-col">
                                    <h4 className="footer-col-title">Top Apps</h4>
                                    <ul className="footer-links">
                                        {apps.slice(0, 5).map(appItem => (
                                            <li key={appItem.id}>
                                                <a 
                                                    href={`/${appItem.id}`} 
                                                    onClick={(e) => { e.preventDefault(); navigateTo('details', appItem.id); }}
                                                    style={{ textDecoration: 'none' }}
                                                >
                                                    {appItem.title}
                                                </a>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>

                            <div className="footer-bottom-bar">
                                <div className="copyright-text">
                                    &copy; {new Date().getFullYear()} Download-Hub Inc. <a href="https://imvishall.netlify.app/" target="_blank" rel="noopener noreferrer" style={{ color: 'var(--play-green)', textDecoration: 'none', fontWeight: 600 }}>Vishal</a>. All Rights Reserved.
                                </div>

                                <div className="footer-bottom-links">
                                    <span className="lang-selector" style={{ cursor: 'pointer' }}>🌐 English (US)</span>
                                    <span style={{ cursor: 'pointer' }}>Privacy Policy</span>
                                    <span style={{ cursor: 'pointer' }}>Terms of Service</span>
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* MODAL 3: Interactive APK Download 5-Second Countdown */}
                    {downloadModalApp && (
                        <div className="modal-overlay active">
                            <div className="modal-box" style={{ textAlign: 'center', maxWidth: '460px' }}>
                                <div style={{ width: '70px', height: '70px', background: 'var(--play-green-light)', color: 'var(--play-green)', fontSize: '2.2rem', fontWeight: 800, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1.25rem auto', border: '2px solid var(--play-green)', boxShadow: '0 4px 12px rgba(1,135,95,0.2)' }}>
                                    {downloadComplete ? '✓' : downloadTimer}
                                </div>

                                <h3 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.4rem', fontWeight: 700, marginBottom: '0.4rem', color: 'var(--text-main)' }}>
                                    {downloadComplete ? 'Download Ready!' : `Preparing ${downloadModalApp.title} APK...`}
                                </h3>

                                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '1.5rem' }}>
                                    {downloadComplete 
                                        ? 'Your APK package is ready. Click the button below to download.'
                                        : `Your APK file download will start in ${downloadTimer} seconds...`}
                                </p>

                                <div style={{ background: 'var(--bg-surface)', height: '10px', borderRadius: '10px', overflow: 'hidden', marginBottom: '1.75rem', border: '1px solid var(--border-color)' }}>
                                    <div style={{ width: `${((5 - downloadTimer) / 5) * 100}%`, height: '100%', background: 'var(--play-green)', transition: 'width 0.2s linear' }}></div>
                                </div>

                                <div style={{ display: 'flex', gap: '0.85rem', justifyContent: 'center' }}>
                                    {!downloadComplete ? (
                                        <button onClick={() => { setDownloading(false); setDownloadModalApp(null); }} className="btn-cancel-download">
                                            Cancel Download
                                        </button>
                                    ) : (
                                        <button onClick={triggerDirectDownload} className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                                            Download APK Package Now
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 4: Screenshot Preview Lightbox */}
                    {previewScreenshot && (
                        <div className="modal-overlay active" onClick={() => setPreviewScreenshot(null)}>
                            <div className="modal-box" style={{ maxWidth: '850px', background: 'transparent', border: 'none', boxShadow: 'none', padding: 0, textAlign: 'center' }}>
                                <img src={formatAssetUrl(previewScreenshot)} alt="Preview" style={{ maxWidth: '100%', maxHeight: '85vh', borderRadius: '16px', boxShadow: '0 20px 50px rgba(0,0,0,0.8)' }} />
                                <p style={{ color: '#FFF', marginTop: '1rem', fontSize: '0.9rem' }}>Click anywhere to close preview</p>
                            </div>
                        </div>
                    )}

                    {/* Floating Scroll-to-Top Action Button (FAB) */}
                    <button 
                        className={`scroll-top-fab ${showScrollTop ? 'visible' : ''}`}
                        onClick={scrollToTop}
                        aria-label="Scroll to top"
                        title="Back to Top"
                    >
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>

                    {/* Google Play Store Native Mobile Bottom Navigation Bar */}
                    <nav className="play-mobile-bottom-bar" aria-label="Mobile Navigation">
                        <button 
                            className={`mobile-nav-item ${currentView === 'home' && selectedCategory === 'all' ? 'active' : ''}`}
                            onClick={() => { setSelectedCategory('all'); navigateTo('home', null); scrollToTop(); }}
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
                            <span>Apps</span>
                        </button>
                        <button 
                            className={`mobile-nav-item ${currentView === 'home' && selectedCategory === 'games' ? 'active' : ''}`}
                            onClick={() => { setSelectedCategory('games'); navigateTo('home', null); scrollToTop(); }}
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="6 11 10 7 14 11 18 7 18 17 6 17 6 11"></polygon><line x1="10" y1="11" x2="10" y2="14"></line><line x1="14" y1="11" x2="14" y2="14"></line></svg>
                            <span>Games</span>
                        </button>
                        <button 
                            className="mobile-nav-item"
                            onClick={() => {
                                scrollToTop();
                                setTimeout(() => {
                                    const el = document.querySelector('.search-input');
                                    if (el) el.focus();
                                }, 100);
                            }}
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <span>Search</span>
                        </button>
                        <button 
                            className="mobile-nav-item"
                            onClick={scrollToTop}
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                            <span>Top</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
