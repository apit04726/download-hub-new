<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownloadHub | Premium Android Apps & Games Portal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="wp-content/themes/download-hub-theme/style.css">

    <!-- React 18 & Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        svg { display: inline-block !important; vertical-align: middle; }
        .brand-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #01875F 0%, #34A853 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(1, 135, 95, 0.3);
            flex-shrink: 0;
        }
        .btn-install-sm {
            background: var(--play-green);
            color: #fff;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-install-sm:hover {
            background: var(--play-green-hover);
        }
        .admin-badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.45rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .admin-badge-pill:hover {
            background: var(--bg-hover);
            border-color: var(--play-green);
        }
        .btn-cancel-download {
            background: #FEF2F2 !important;
            color: #DC2626 !important;
            border: 1px solid #FCA5A5 !important;
            font-size: 0.9rem !important;
            font-weight: 600 !important;
            padding: 0.65rem 1.5rem !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            width: 100% !important;
            justify-content: center !important;
            transition: all 0.2s ease !important;
            font-family: inherit !important;
            outline: none !important;
        }
        .btn-cancel-download:hover {
            background: #FEE2E2 !important;
            border-color: #F87171 !important;
            color: #B91C1C !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [apps, setApps] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);

            // Single Source of Truth: Load data_store.json dynamically
            React.useEffect(() => {
                fetch('data_store.json?t=' + Date.now())
                    .then(res => res.json())
                    .then(data => {
                        const localEdits = localStorage.getItem('download_hub_custom_edits');
                        if (localEdits) {
                            try {
                                setApps(JSON.parse(localEdits));
                                setIsLoading(false);
                                return;
                            } catch (e) {}
                        }
                        setApps(data);
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error("Error loading data_store.json:", err);
                        setIsLoading(false);
                    });
            }, []);

            // View Routing: 'home', 'details'
            const [currentView, setCurrentView] = React.useState('home');
            const [selectedAppId, setSelectedAppId] = React.useState(null);
            const [selectedCategory, setSelectedCategory] = React.useState('all');
            const [searchQuery, setSearchQuery] = React.useState('');

            // APK Download Modal State
            const [downloadModalApp, setDownloadModalApp] = React.useState(null);
            const [downloadTimer, setDownloadTimer] = React.useState(5);
            const [downloading, setDownloading] = React.useState(false);
            const [downloadComplete, setDownloadComplete] = React.useState(false);

            // Screenshot Preview Lightbox
            const [previewScreenshot, setPreviewScreenshot] = React.useState(null);

            // Scroll Screenshots Carousel
            const scrollScreenshots = (amount) => {
                const el = document.getElementById('playScreenshotScroll');
                if (el) {
                    el.scrollBy({ left: amount, behavior: 'smooth' });
                }
            };


            // Start APK Download Countdown
            const startDownloadFlow = (appItem) => {
                setDownloadModalApp(appItem);
                setDownloadTimer(5);
                setDownloading(true);
                setDownloadComplete(false);
            };

            // Trigger actual direct file download
            const triggerDirectDownload = () => {
                if (!downloadModalApp) return;
                let apkPath = downloadModalApp.acf?.apk_file;
                if (!apkPath || apkPath === '#') {
                    apkPath = `uploads/apks/${downloadModalApp.id}.apk`;
                }
                
                // Trigger download link
                const link = document.createElement('a');
                link.href = apkPath;
                link.rel = 'noopener';
                link.setAttribute('download', `${downloadModalApp.id}.apk`);
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    document.body.removeChild(link);
                }, 100);

                setDownloadModalApp(null);
            };

            // Filtered Apps List based on Category and Search Query
            const filteredApps = apps.filter(app => {
                const matchesCat = selectedCategory === 'all' || 
                    (app.category_slug && app.category_slug.toLowerCase() === selectedCategory.toLowerCase()) ||
                    (app.category && app.category.toLowerCase() === selectedCategory.toLowerCase());

                const q = searchQuery.toLowerCase().trim();
                const matchesSearch = !q || 
                    app.title.toLowerCase().includes(q) || 
                    (app.tagline && app.tagline.toLowerCase().includes(q)) || 
                    (app.category && app.category.toLowerCase().includes(q));

                return matchesCat && matchesSearch;
            });

            const selectedApp = apps.find(a => a.id === selectedAppId);

            return (
                <div>
                    {/* Header Navbar */}
                    <header className="site-header">
                        <div className="nav-container">
                            <a href="#" onClick={(e) => { e.preventDefault(); setCurrentView('home'); setSelectedAppId(null); }} className="brand-logo" style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', textDecoration: 'none' }}>
                                <div className="brand-logo-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="7 10 12 15 17 10"></polyline>
                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                    </svg>
                                </div>
                                <div style={{ fontFamily: 'var(--font-heading)', fontSize: '1.3rem', fontWeight: 800, color: 'var(--text-main)', letterSpacing: '-0.02em', display: 'flex', alignItems: 'center' }}>
                                    Download<span style={{ color: 'var(--play-green)' }}>Hub</span>
                                    <span style={{ width: '6px', height: '6px', background: 'var(--play-green)', borderRadius: '50%', display: 'inline-block', marginLeft: '2px' }}></span>
                                </div>
                            </a>

                            {/* Category Nav Links */}
                            <nav className="play-nav-links">
                                {['all', 'games', 'tools', 'photography', 'health', 'productivity'].map(cat => (
                                    <a 
                                        key={cat} 
                                        href="#" 
                                        onClick={(e) => { e.preventDefault(); setSelectedCategory(cat); setCurrentView('home'); }}
                                        className={`play-nav-item ${selectedCategory === cat ? 'active' : ''}`}
                                        style={{ textDecoration: 'none', textTransform: 'capitalize' }}
                                    >
                                        {cat === 'all' ? 'Apps' : cat}
                                    </a>
                                ))}
                            </nav>

                            {/* Search Input */}
                            <div className="search-bar-wrap">
                                <svg className="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input 
                                    type="text" 
                                    className="search-input" 
                                    placeholder="Search Android apps, games, APKs..." 
                                    value={searchQuery}
                                    onChange={(e) => { setSearchQuery(e.target.value); setCurrentView('home'); }}
                                />
                                <span className="search-kbd">⌘K</span>
                            </div>


                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="layout-container">
                        {currentView === 'home' && (
                            <div>
                                {/* Hero Banner */}
                                <section className="play-hero-banner">
                                    <div className="play-hero-banner-content">
                                        <span className="security-badge-box" style={{ marginBottom: '0.75rem' }}>
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#01875F" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                            100% Malware Free & Play Protect Verified
                                        </span>
                                        <h1 className="play-hero-banner-title">Discover & Download Premium Android Apps</h1>
                                        <p className="play-hero-banner-sub">Your trusted destination for verified, virus-free Android APKs, original app packages, and high-speed direct downloads.</p>
                                    </div>
                                </section>

                                {/* Section Header */}
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
                                    <div>
                                        <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.5rem', fontWeight: 700, color: 'var(--text-main)' }}>
                                            {selectedCategory === 'all' ? 'Recommended Applications' : `${selectedCategory.charAt(0).toUpperCase() + selectedCategory.slice(1)} Apps`}
                                        </h2>
                                        <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Selected top rated apps & games</p>
                                    </div>
                                    <span style={{ color: 'var(--play-green)', fontWeight: 700, fontSize: '0.9rem' }}>
                                        {filteredApps.length} Apps Available
                                    </span>
                                </div>

                                {/* Apps Grid */}
                                {filteredApps.length === 0 ? (
                                    <div style={{ padding: '4rem 2rem', textAlign: 'center', background: 'var(--bg-surface)', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)', marginBottom: '3rem' }}>
                                        <h3 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.5rem', marginBottom: '0.5rem' }}>No Apps Found</h3>
                                        <p style={{ color: 'var(--text-muted)', marginBottom: '1.5rem' }}>Try searching for another keyword or upload a new app via Admin Portal.</p>
                                        <button onClick={() => { setSelectedCategory('all'); setSearchQuery(''); }} className="btn-primary">View All Apps</button>
                                    </div>
                                ) : (
                                    <div className="play-apps-grid">
                                        {filteredApps.map(appItem => {
                                            const acf = appItem.acf || {};
                                            return (
                                                <article key={appItem.id} className="play-app-card">
                                                    <div>
                                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '0.85rem' }}>
                                                            <a href="#" onClick={(e) => { e.preventDefault(); setSelectedAppId(appItem.id); setCurrentView('details'); }}>
                                                                <img src={acf.app_icon} alt={appItem.title} className="play-card-icon" loading="lazy" />
                                                            </a>
                                                            <span className="card-cat-tag">{appItem.category}</span>
                                                        </div>

                                                        <div className="play-card-info" style={{ marginBottom: '0.85rem' }}>
                                                            <h3 className="play-card-name">
                                                                <a href="#" onClick={(e) => { e.preventDefault(); setSelectedAppId(appItem.id); setCurrentView('details'); }}>
                                                                    {appItem.title}
                                                                </a>
                                                            </h3>
                                                            <div className="play-card-company">{acf.app_developer}</div>
                                                            
                                                            <div className="play-card-badges">
                                                                <span className="rating-badge">★ {acf.app_rating}</span>
                                                                <span className="version-badge">{acf.app_version}</span>
                                                                <span className="size-badge">{acf.app_size}</span>
                                                            </div>
                                                        </div>

                                                        <p className="play-card-desc">{appItem.tagline}</p>
                                                    </div>

                                                    <div className="play-card-footer">
                                                        <span className="download-count">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                                                <polyline points="7 10 12 15 17 10"></polyline>
                                                                <line x1="12" y1="15" x2="12" y2="3"></line>
                                                            </svg>
                                                            <span>{Number(acf.download_count || 100).toLocaleString()}</span> downloads
                                                        </span>

                                                        <button 
                                                            onClick={() => { setSelectedAppId(appItem.id); setCurrentView('details'); }} 
                                                            className="btn-install-sm" 
                                                            style={{ padding: '0.5rem 1.25rem' }}
                                                        >
                                                            View Details
                                                        </button>
                                                    </div>
                                                </article>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* SINGLE APP DETAILS VIEW */}
                        {currentView === 'details' && selectedApp && (
                            <div>
                                {/* Breadcrumbs & Admin Actions */}
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.25rem', flexWrap: 'wrap', gap: '0.75rem' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                                        <a href="#" onClick={(e) => { e.preventDefault(); setCurrentView('home'); }} style={{ color: 'var(--text-muted)', fontSize: '0.9rem', fontWeight: 500 }}>Apps</a>
                                        <span style={{ color: 'var(--text-dim)' }}>&rsaquo;</span>
                                        <span className="card-cat-tag">{selectedApp.category}</span>
                                    </div>

                                    {isAdminLoggedIn && (
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                            <button onClick={() => openAppForm(selectedApp)} style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', background: 'var(--play-green)', color: '#FFF', padding: '0.45rem 1rem', borderRadius: 'var(--radius-full)', fontSize: '0.85rem', fontWeight: 600, border: 'none', cursor: 'pointer' }}>
                                                ✏️ Edit App
                                            </button>
                                            <button onClick={() => handleDeleteApp(selectedApp.id)} style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', background: 'rgba(239, 68, 68, 0.12)', color: '#EF4444', border: '1px solid #EF4444', padding: '0.45rem 0.95rem', borderRadius: 'var(--radius-full)', fontSize: '0.85rem', fontWeight: 600, cursor: 'pointer' }}>
                                                🗑️ Delete App
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* Hero Section */}
                                <section className="play-hero">
                                    <div className="play-hero-left">
                                        <h1 className="play-hero-title">{selectedApp.title}</h1>
                                        <div className="play-hero-company">{selectedApp.acf?.app_developer}</div>

                                        <div className="play-stats-row">
                                            <div className="play-stat-col">
                                                <div className="play-stat-val">{selectedApp.acf?.app_rating} ★</div>
                                                <div className="play-stat-sub">{selectedApp.acf?.rating_count || '2,400'} reviews</div>
                                            </div>

                                            <div className="play-stat-col" style={{ borderLeft: '1px solid var(--border-color)', paddingLeft: '2rem' }}>
                                                <div className="play-stat-val">{Number(selectedApp.acf?.download_count || 100).toLocaleString()}+</div>
                                                <div className="play-stat-sub">Downloads</div>
                                            </div>

                                            <div className="play-stat-col" style={{ borderLeft: '1px solid var(--border-color)', paddingLeft: '2rem' }}>
                                                <div className="play-stat-val" style={{ fontSize: '0.95rem' }}>
                                                    <span style={{ border: '1px solid var(--text-muted)', padding: '0.15rem 0.5rem', borderRadius: '4px', fontSize: '0.75rem', fontWeight: 700 }}>12+</span>
                                                </div>
                                                <div className="play-stat-sub">Rated for 12+</div>
                                            </div>
                                        </div>

                                        <div className="play-hero-actions">
                                            <button className="btn-install" onClick={() => startDownloadFlow(selectedApp)}>
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                                Install APK ({selectedApp.acf?.app_size})
                                            </button>

                                            <button className="btn-secondary-action" onClick={() => { navigator.clipboard.writeText(window.location.href); alert('App Link copied to clipboard!'); }}>
                                                Share
                                            </button>
                                        </div>

                                        <div className="device-compatibility" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', marginTop: '1.25rem' }}>
                                            <div style={{ display: 'inline-flex', alignItems: 'flex-start', gap: '0.55rem' }}>
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#01875F" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                <span style={{ fontSize: '0.88rem', color: 'var(--text-muted)' }}>This app is available for your device (Requires {selectedApp.acf?.min_android})</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="play-hero-right">
                                        <img src={selectedApp.acf?.app_icon} alt={selectedApp.title} className="play-hero-app-icon" />
                                    </div>
                                </section>

                                {/* Screenshots Carousel with Navigation Arrows */}
                                {selectedApp.acf?.screenshots && selectedApp.acf.screenshots.length > 0 && (
                                    <section className="play-screenshots-container" style={{ position: 'relative' }}>
                                        <button className="screenshot-arrow arrow-left" onClick={() => scrollScreenshots(-350)} aria-label="Previous screenshots">
                                            &lsaquo;
                                        </button>
                                        <div className="play-screenshots-scroll" id="playScreenshotScroll">
                                            {selectedApp.acf.screenshots.map((shot, idx) => (
                                                <div key={idx} className="screenshot-wrapper" onClick={() => setPreviewScreenshot(shot)}>
                                                    <img src={shot} alt={`Screenshot ${idx + 1}`} className="play-screenshot-item" />
                                                    <div className="screenshot-overlay-zoom">
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button className="screenshot-arrow arrow-right" onClick={() => scrollScreenshots(350)} aria-label="Next screenshots">
                                            &rsaquo;
                                        </button>
                                    </section>
                                )}

                                {/* Details & Sidebar */}
                                <div className="play-main-layout">
                                    <div className="play-content-left">
                                        <div className="play-section-title">
                                            <span>About this app</span>
                                        </div>
                                        <p className="play-description" style={{ whiteSpace: 'pre-line' }}>{selectedApp.description}</p>

                                        <div className="play-section-title">
                                            <span>Technical Specifications & Package Info</span>
                                        </div>

                                        <div className="play-specs-grid">
                                            <div className="spec-card">
                                                <div className="spec-icon">📦</div>
                                                <div>
                                                    <div className="spec-cell-label">Version</div>
                                                    <div className="spec-cell-val">{selectedApp.acf?.app_version}</div>
                                                </div>
                                            </div>
                                            <div className="spec-card">
                                                <div className="spec-icon">📅</div>
                                                <div>
                                                    <div className="spec-cell-label">Updated on</div>
                                                    <div className="spec-cell-val">{selectedApp.acf?.release_date}</div>
                                                </div>
                                            </div>
                                            <div className="spec-card">
                                                <div className="spec-icon">⚡</div>
                                                <div>
                                                    <div className="spec-cell-label">Download Size</div>
                                                    <div className="spec-cell-val">{selectedApp.acf?.app_size}</div>
                                                </div>
                                            </div>
                                            <div className="spec-card">
                                                <div className="spec-icon">📱</div>
                                                <div>
                                                    <div className="spec-cell-label">Requires Android</div>
                                                    <div className="spec-cell-val">{selectedApp.acf?.min_android}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {selectedApp.acf?.features && selectedApp.acf.features.length > 0 && (
                                            <div style={{ marginTop: '2.5rem' }}>
                                                <div className="play-section-title">
                                                    <span>Key Highlights & Features</span>
                                                </div>
                                                <ul className="features-checklist play-features-grid">
                                                    {selectedApp.acf.features.map((feat, idx) => (
                                                        <li key={idx} style={{ display: 'flex', alignItems: 'center', gap: '0.85rem', background: 'var(--bg-surface)', padding: '0.85rem 1.25rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)' }}>
                                                            <div className="check-icon">✓</div>
                                                            <span>{feat}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}
                                    </div>

                                    {/* Sidebar */}
                                    <div className="play-sidebar">
                                        <div className="sidebar-card">
                                            <div className="sidebar-title">
                                                <span>App support</span>
                                            </div>
                                            <div style={{ fontSize: '0.88rem', color: 'var(--text-muted)', display: 'grid', gap: '0.75rem' }}>
                                                <div>📧 <strong>Support Email:</strong> support@{selectedApp.id}.com</div>
                                                <div>🌐 <strong>Developer:</strong> {selectedApp.acf?.app_developer}</div>
                                                <div>🔒 <strong>Privacy Policy:</strong> <span style={{ color: 'var(--play-green)', fontWeight: 600 }}>Verified Clean</span></div>
                                            </div>
                                        </div>

                                        <div className="sidebar-card">
                                            <div className="sidebar-title" style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                <span>Similar apps</span>
                                                <a href="#" onClick={(e) => { e.preventDefault(); setCurrentView('home'); }} style={{ color: 'var(--play-green)', fontSize: '0.85rem' }}>View All</a>
                                            </div>
                                            {apps.filter(a => a.id !== selectedApp.id).slice(0, 3).map(other => (
                                                <a key={other.id} href="#" onClick={(e) => { e.preventDefault(); setSelectedAppId(other.id); }} className="similar-app-item">
                                                    <img src={other.acf?.app_icon} className="similar-app-icon" />
                                                    <div className="similar-app-meta">
                                                        <div className="similar-app-name">{other.title}</div>
                                                        <div className="similar-app-company">{other.acf?.app_developer}</div>
                                                        <div className="similar-app-rating">★ {other.acf?.app_rating}</div>
                                                    </div>
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="site-footer" style={{ marginTop: '4rem', background: 'var(--bg-surface)', borderTop: '1px solid var(--border-color)', padding: '3rem 1rem 1.5rem 1rem' }}>
                        <div className="footer-container" style={{ maxWidth: '1200px', margin: '0 auto' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--border-color)', paddingBottom: '1.5rem', marginBottom: '1.5rem' }}>
                                <div style={{ fontWeight: 800, fontSize: '1.2rem' }}>Download<span style={{ color: 'var(--play-green)' }}>Hub</span></div>
                                <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>&copy; 2026 Download-Hub Inc. All Rights Reserved.</div>
                            </div>
                        </div>
                    </footer>



                    {/* MODAL 3: Interactive APK Download 5-Second Countdown */}
                    {downloadModalApp && (
                        <div className="modal-overlay active">
                            <div className="modal-box" style={{ textAlign: 'center', maxWidth: '460px' }}>
                                <div style={{ width: '70px', height: '70px', background: 'var(--play-green-light)', color: 'var(--play-green)', fontSize: '2.2rem', fontWeight: 800, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1.25rem auto', border: '2px solid var(--play-green)', boxShadow: '0 4px 12px rgba(1,135,95,0.2)' }}>
                                    {downloadComplete ? '✓' : downloadTimer}
                                </div>

                                <h3 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.4rem', fontWeight: 700, marginBottom: '0.4rem', color: 'var(--text-main)' }}>
                                    {downloadComplete ? 'Download Ready!' : `Preparing ${downloadModalApp.title} APK...`}
                                </h3>

                                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '1.5rem' }}>
                                    {downloadComplete 
                                        ? 'Your APK package is ready. Click the button below to download.'
                                        : `Your APK file download will start in ${downloadTimer} seconds...`}
                                </p>

                                <div style={{ background: 'var(--bg-surface)', height: '10px', borderRadius: '10px', overflow: 'hidden', marginBottom: '1.75rem', border: '1px solid var(--border-color)' }}>
                                    <div style={{ width: `${((5 - downloadTimer) / 5) * 100}%`, height: '100%', background: 'var(--play-green)', transition: 'width 0.2s linear' }}></div>
                                </div>

                                <div style={{ display: 'flex', gap: '0.85rem', justifyContent: 'center' }}>
                                    {!downloadComplete ? (
                                        <button onClick={() => { setDownloading(false); setDownloadModalApp(null); }} className="btn-cancel-download">
                                            Cancel Download
                                        </button>
                                    ) : (
                                        <button onClick={triggerDirectDownload} className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                                            Download APK Package Now
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 4: Screenshot Preview Lightbox */}
                    {previewScreenshot && (
                        <div className="modal-overlay active" onClick={() => setPreviewScreenshot(null)}>
                            <div className="modal-box" style={{ maxWidth: '850px', background: 'transparent', border: 'none', boxShadow: 'none', padding: 0, textAlign: 'center' }}>
                                <img src={previewScreenshot} alt="Preview" style={{ maxWidth: '100%', maxHeight: '85vh', borderRadius: '16px', boxShadow: '0 20px 50px rgba(0,0,0,0.8)' }} />
                                <p style={{ color: '#FFF', marginTop: '1rem', fontSize: '0.9rem' }}>Click anywhere to close preview</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
